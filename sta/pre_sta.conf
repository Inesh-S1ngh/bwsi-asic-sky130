# OpenSTA script used for pre-layout timing checks on picorv32a.
# Long file paths were cut off in my screenshot, so they are shown as <...> here.
set_cmd_units -time ns -capacitance pF -current mA -voltage V -resistance kOhm -distance um

read_liberty -max <path-to>/<max-corner>.lib
read_liberty -min <path-to>/<min-corner>.lib

read_verilog <path-to>/results/synthesis/<synthesized-netlist>.v
link_design picorv32a

read_sdc <path-to>/picorv32a/src/<constraints>.sdc
report_checks -path_delay min_max -fields {slew trans net cap input_pin}

report_tns

report_wns
